<div class="change-password-container">
  <div class="change-password-card">
    <!-- Header -->
    <div class="card-header">
      <div class="header-icon">
        <i class="fas fa-lock"></i>
      </div>
      <h2 class="card-title">Change Password</h2>
      <p class="card-subtitle">Update your password to keep your account secure</p>
    </div>

    <!-- Form -->
    <form (ngSubmit)="onSubmit()" class="change-password-form">
      <!-- Current Password -->
      <div class="form-group">
        <label for="oldPassword" class="form-label">
          <i class="fas fa-key"></i>
          Current Password
        </label>
        <div class="password-input-group">
          <input
            type="password"
            id="oldPassword"
            name="oldPassword"
            [(ngModel)]="changePasswordData.oldPassword"
            class="form-control"
            [class.form-control-error]="!changePasswordData.oldPassword && changePasswordData.newPassword"
            placeholder="Enter your current password"
            required>
          <button
            type="button"
            class="password-toggle"
            (click)="togglePasswordVisibility('old')"
            [attr.aria-label]="showOldPassword ? 'Hide password' : 'Show password'">
            <i class="fas" [class.fa-eye]="!showOldPassword" [class.fa-eye-slash]="showOldPassword"></i>
          </button>
        </div>
      </div>

      <!-- New Password -->
      <div class="form-group">
        <label for="newPassword" class="form-label">
          <i class="fas fa-lock"></i>
          New Password
        </label>
        <div class="password-input-group">
          <input
            type="password"
            id="newPassword"
            name="newPassword"
            [(ngModel)]="changePasswordData.newPassword"
            class="form-control"
            [class.form-control-error]="changePasswordData.newPassword && changePasswordData.newPassword.length < 8"
            placeholder="Enter your new password"
            required>
          <button
            type="button"
            class="password-toggle"
            (click)="togglePasswordVisibility('new')"
            [attr.aria-label]="showNewPassword ? 'Hide password' : 'Show password'">
            <i class="fas" [class.fa-eye]="!showNewPassword" [class.fa-eye-slash]="showNewPassword"></i>
          </button>
        </div>
        <div class="password-requirements">
          <small class="text-muted">
            <i class="fas fa-info-circle"></i>
            Password must be at least 8 characters long
          </small>
        </div>
      </div>

      <!-- Confirm New Password -->
      <div class="form-group">
        <label for="confirmPassword" class="form-label">
          <i class="fas fa-check-circle"></i>
          Confirm New Password
        </label>
        <div class="password-input-group">
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            [(ngModel)]="changePasswordData.confirmPassword"
            class="form-control"
            [class.form-control-error]="changePasswordData.confirmPassword && changePasswordData.newPassword !== changePasswordData.confirmPassword"
            placeholder="Confirm your new password"
            required>
          <button
            type="button"
            class="password-toggle"
            (click)="togglePasswordVisibility('confirm')"
            [attr.aria-label]="showConfirmPassword ? 'Hide password' : 'Show password'">
            <i class="fas" [class.fa-eye]="!showConfirmPassword" [class.fa-eye-slash]="showConfirmPassword"></i>
          </button>
        </div>
        <div class="password-match" *ngIf="changePasswordData.confirmPassword">
          <small [class.text-success]="changePasswordData.newPassword === changePasswordData.confirmPassword" 
                 [class.text-danger]="changePasswordData.newPassword !== changePasswordData.confirmPassword">
            <i class="fas" [class.fa-check]="changePasswordData.newPassword === changePasswordData.confirmPassword" 
               [class.fa-times]="changePasswordData.newPassword !== changePasswordData.confirmPassword"></i>
            {{ changePasswordData.newPassword === changePasswordData.confirmPassword ? 'Passwords match' : 'Passwords do not match' }}
          </small>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="form-actions">
        <button type="button" class="btn btn-secondary" (click)="onCancel()" [disabled]="isLoading">
          <i class="fas fa-times"></i>
          Cancel
        </button>
        <button type="submit" class="btn btn-primary" [disabled]="isLoading">
          <i class="fas fa-save" *ngIf="!isLoading"></i>
          <i class="fas fa-spinner fa-spin" *ngIf="isLoading"></i>
          {{ isLoading ? 'Changing...' : 'Change Password' }}
        </button>
      </div>
    </form>
  </div>
</div>
