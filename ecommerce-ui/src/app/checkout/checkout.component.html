<!-- Loading Overlay -->
<app-loader 
  *ngIf="submitting" 
  [fullPage]="true"
  message="Processing your order..." 
  subMessage="Please wait while we complete your purchase">
</app-loader>

<div class="container py-5" style="max-width: 800px;">
  <div class="card shadow rounded p-4 border-0">
    <h2 class="mb-4 text-center text-primary fw-bold">🧾 Checkout</h2>

    <form [formGroup]="checkoutForm" (ngSubmit)="openPaymentModal()" class="row g-3">
      <!-- Shipping Info -->
      <div class="col-md-6">
        <label class="form-label fw-medium">Full Name</label>
        <input formControlName="fullName" class="form-control rounded-pill px-3" placeholder="John Doe" />
      </div>
      <div class="col-md-6">
        <label class="form-label fw-medium">Phone Number</label>
        <input formControlName="phoneNumber" class="form-control rounded-pill px-3" placeholder="+91 9876543210" />
      </div>
      <div class="col-12">
        <label class="form-label fw-medium">Shipping Address</label>
        <textarea formControlName="address" rows="3" class="form-control rounded-3 px-3" placeholder="Apartment, Street, City, ZIP"></textarea>
      </div>

      <!-- Order Summary -->
      <div class="col-12 mt-4">
        <h5 class="fw-bold">🛒 Order Summary</h5>
        <ul class="list-group mb-3 shadow-sm">
          <li *ngFor="let item of cartItems" class="list-group-item d-flex justify-content-between align-items-center">
            <span>{{ item.product.name }} × {{ item.quantity }}</span>
            <span class="text-muted">${{ (item.product.price * item.quantity).toFixed(2) }}</span>
          </li>
          <li class="list-group-item d-flex justify-content-between fw-bold bg-light">
            Total: <span class="text-dark">${{ getTotal().toFixed(2) }}</span>
          </li>
        </ul>
      </div>

      <!-- Error message -->
      <div *ngIf="error" class="text-danger text-center small">{{ error }}</div>

      <!-- Submit Button -->
      <div class="col-12">
        <button class="btn btn-primary w-100" type="submit" [disabled]="submitting || checkoutForm.invalid">
           {{ submitting ? 'Processing...' : 'Proceed to Payment' }}
        </button>
      </div>
    </form>
  </div>
</div>

<!-- Stripe Payment Modal -->
<div class="modal fade" id="paymentModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title">Enter Card Details</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="card-element" class="form-control"></div>
        <div id="card-errors" class="text-danger mt-2 small"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-success" (click)="confirmPayment()" [disabled]="submitting">
          {{ submitting ? 'Confirming…' : 'Pay & Place Order' }}
        </button>
      </div>
    </div>
  </div>
</div>
