<app-admin-navbar *ngIf="isLoggedIn && isAdmin"></app-admin-navbar>

<!-- Regular Navbar for all users (guest and logged-in) except on login/register pages -->
<app-navbar *ngIf="!isLoginPage && !(isLoggedIn && isAdmin)"></app-navbar>

<app-rate-limit-notification></app-rate-limit-notification>
