syntax = "proto3";

option csharp_namespace = "Ecommerce.Contracts.Products";

package products;

service ProductService {
  rpc GetProduct (GetProductRequest) returns (ProductResponse);
  rpc CheckStock (CheckStockRequest) returns (StockCheckResponse);
  rpc UpdateStock (UpdateStockRequest) returns (StockUpdateResponse);
  rpc GetProductsByIds (GetProductsByIdsRequest) returns (ProductsResponse);
}

message GetProductRequest {
  int32 product_id = 1;
}

message ProductResponse {
  int32 product_id = 1;
  string name = 2;
  string description = 3;
  double price = 4;
  int32 stock_quantity = 5;
  string stock_status = 6;
  string category_name = 7;
  string image_url = 8;
  bool is_available = 9;
}

message CheckStockRequest {
  int32 product_id = 1;
  int32 quantity = 2;
}

message StockCheckResponse {
  bool is_available = 1;
  int32 available_quantity = 2;
  string message = 3;
}

message UpdateStockRequest {
  int32 product_id = 1;
  int32 quantity_change = 2;
  bool is_increase = 3;
}

message StockUpdateResponse {
  bool success = 1;
  int32 new_quantity = 2;
  string message = 3;
}

message GetProductsByIdsRequest {
  repeated int32 product_ids = 1;
}

message ProductsResponse {
  repeated ProductResponse products = 1;
}
