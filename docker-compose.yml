services:
  ecommerce-api:
    build:
      context: ./EcommerceAPI/BulkyBook-POC
      dockerfile: Dockerfile
    container_name: ecommerce-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Server=sqlserver;Database=EcommerceDB;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=true
      Jwt__SecretKey: ${JWT_SECRET_KEY}
      Stripe__SecretKey: ${STRIPE_SECRET_KEY:-}
      Redis__ConnectionString: redis:6379
      Redis__IsCacheEnabled: true
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__Username: guest
      RabbitMQ__Password: guest
      RabbitMQ__Enabled: true
      Frontend__BaseUrl: ${FRONTEND_BASE_URL:-http://localhost:4200}
      Frontend__AllowedOrigins__0: ${FRONTEND_BASE_URL:-http://localhost:4200}
      Frontend__AllowedOrigins__1: ${LEGACY_FRONTEND_BASE_URL:-http://localhost:4201}
      Cors__AllowedOrigins__0: ${FRONTEND_BASE_URL:-http://localhost:4200}
      Cors__AllowedOrigins__1: ${LEGACY_FRONTEND_BASE_URL:-http://localhost:4201}
      OAuth__BaseUrl: ${PUBLIC_APP_BASE_URL:-http://localhost:4200}
      GoogleOAuth__BaseUrl: ${PUBLIC_APP_BASE_URL:-http://localhost:4200}
      ReverseProxy__TrustForwardedHeaders: ${TRUST_FORWARDED_HEADERS:-false}
    secrets:
      - source: sendgrid_api_key
        target: SendGrid__ApiKey
      - source: sendgrid_from_email
        target: SendGrid__FromEmail
      - source: sendgrid_from_name
        target: SendGrid__FromName
      - source: sendgrid_order_confirmation_template_id
        target: SendGrid__OrderConfirmationTemplateId
    ports:
      - "7273:8080"
    depends_on:
      sqlserver:
        condition: service_started
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    networks:
      - ecommerce-network

  ecommerce-order-service:
    build:
      context: ./EcommerceAPI/BulkyBook-POC
      dockerfile: Dockerfile.OrderService
    container_name: ecommerce-order-service
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Server=sqlserver;Database=EcommerceDB;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=true
      Jwt__SecretKey: ${JWT_SECRET_KEY}
      Stripe__SecretKey: ${STRIPE_SECRET_KEY:-}
      Redis__ConnectionString: redis:6379
      Redis__IsCacheEnabled: true
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__Username: guest
      RabbitMQ__Password: guest
      RabbitMQ__Enabled: true
      Frontend__BaseUrl: ${FRONTEND_BASE_URL:-http://localhost:4200}
      Frontend__AllowedOrigins__0: ${FRONTEND_BASE_URL:-http://localhost:4200}
      Frontend__AllowedOrigins__1: ${LEGACY_FRONTEND_BASE_URL:-http://localhost:4201}
      Cors__AllowedOrigins__0: ${FRONTEND_BASE_URL:-http://localhost:4200}
      Cors__AllowedOrigins__1: ${LEGACY_FRONTEND_BASE_URL:-http://localhost:4201}
    secrets:
      - source: sendgrid_api_key
        target: SendGrid__ApiKey
      - source: sendgrid_from_email
        target: SendGrid__FromEmail
      - source: sendgrid_from_name
        target: SendGrid__FromName
      - source: sendgrid_order_confirmation_template_id
        target: SendGrid__OrderConfirmationTemplateId
    ports:
      - "7274:8080"
    depends_on:
      sqlserver:
        condition: service_started
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    networks:
      - ecommerce-network

  ecommerce-ui:
    build:
      context: ./ecommerce-react
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
    container_name: ecommerce-ui
    ports:
      - "4200:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      - ecommerce-api
      - ecommerce-order-service
    networks:
      - ecommerce-network

  ecommerce-angular:
    profiles:
      - legacy
    build:
      context: ./ecommerce-ui
      dockerfile: Dockerfile
    container_name: ecommerce-angular
    ports:
      - "4201:80"
    volumes:
      - ./ecommerce-react/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      - ecommerce-api
      - ecommerce-order-service
    networks:
      - ecommerce-network

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ecommerce-sqlserver
    environment:
      ACCEPT_EULA: Y
      SA_PASSWORD: ${SQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - ecommerce-network

  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ecommerce-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: ecommerce-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - ecommerce-network

  sonarqube-db:
    image: postgres:15-alpine
    profiles:
      - quality
    environment:
      POSTGRES_USER: ${SONARQUBE_DB_USER}
      POSTGRES_PASSWORD: ${SONARQUBE_DB_PASSWORD}
      POSTGRES_DB: ${SONARQUBE_DB_NAME}
    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SONARQUBE_DB_USER} -d ${SONARQUBE_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ecommerce-network

  sonarqube:
    image: sonarqube:community
    profiles:
      - quality
    hostname: sonarqube
    depends_on:
      sonarqube-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/${SONARQUBE_DB_NAME}
      SONAR_JDBC_USERNAME: ${SONARQUBE_DB_USER}
      SONAR_JDBC_PASSWORD: ${SONARQUBE_DB_PASSWORD}
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    networks:
      - ecommerce-network

secrets:
  sendgrid_api_key:
    file: ./.secrets/SendGrid__ApiKey
  sendgrid_from_email:
    file: ./.secrets/SendGrid__FromEmail
  sendgrid_from_name:
    file: ./.secrets/SendGrid__FromName
  sendgrid_order_confirmation_template_id:
    file: ./.secrets/SendGrid__OrderConfirmationTemplateId

volumes:
  sqlserver_data:
  redis_data:
  rabbitmq_data:
  sonarqube_db_data:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:

networks:
  ecommerce-network:
    driver: bridge
