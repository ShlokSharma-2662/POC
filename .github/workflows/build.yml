name: Build

on:
  push:
    branches:
      - Dev


jobs:
  build:
    name: Build and analyze
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu' # Alternative distribution options are available.
      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache SonarQube scanner
        id: cache-sonar-scanner
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner
      - name: Install SonarQube scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          New-Item -Path ${{ runner.temp }}\scanner -ItemType Directory
          dotnet tool update dotnet-sonarscanner --tool-path ${{ runner.temp }}\scanner
      - name: Validate SonarQube secrets
        shell: powershell
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SONAR_TOKEN)) {
            throw "Missing SONAR_TOKEN secret."
          }
          if ([string]::IsNullOrWhiteSpace($env:SONAR_HOST_URL)) {
            throw "Missing SONAR_HOST_URL secret."
          }
          if ($env:SONAR_HOST_URL -match '^(https?://)?(localhost|127\.0\.0\.1|::1)(:\d+)?/?$') {
            throw "SONAR_HOST_URL points to localhost. GitHub-hosted runners cannot reach your local machine. Use a publicly reachable SonarQube URL or run this workflow on a self-hosted runner."
          }
          try {
            $versionEndpoint = ($env:SONAR_HOST_URL.TrimEnd('/')) + "/api/server/version"
            Invoke-WebRequest -Uri $versionEndpoint -UseBasicParsing -TimeoutSec 20 | Out-Null
          } catch {
            throw "Cannot reach SonarQube at SONAR_HOST_URL from the runner: $($env:SONAR_HOST_URL)"
          }
      - name: Build and analyze
        shell: powershell
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          ${{ runner.temp }}\scanner\dotnet-sonarscanner begin /k:"POC" /d:sonar.token="$env:SONAR_TOKEN" /d:sonar.host.url="$env:SONAR_HOST_URL"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build EcommerceAPI/BulkyBook-POC/Ecommerce.sln
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ${{ runner.temp }}\scanner\dotnet-sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
