name: "CodeQL Advanced"

on:
  push:
    branches: ["Dev"]
  pull_request:
    branches: ["Dev"]
  schedule:
    - cron: "44 17 * * 4"
  workflow_dispatch:

permissions:
  security-events: write
  packages: read
  actions: read
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
          - language: javascript-typescript
            build-mode: manual

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Setup Node.js
        if: matrix.language == 'javascript-typescript'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ecommerce-react/package-lock.json
            ecommerce-ui/package-lock.json

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Install dependencies and build .NET
        if: matrix.language == 'csharp'
        run: |
          dotnet restore EcommerceAPI/BulkyBook-POC/Ecommerce.sln
          dotnet build EcommerceAPI/BulkyBook-POC/Ecommerce.sln --no-restore --configuration Release

      - name: Install dependencies and build JavaScript/TypeScript apps
        if: matrix.language == 'javascript-typescript'
        run: |
          cd ecommerce-react
          npm ci
          npm run build
          cd ../ecommerce-ui
          npm ci
          npm run build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
